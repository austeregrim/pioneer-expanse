<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2b1414" stop-opacity="1"/>
      <stop offset="100%" stop-color="#120808" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="rescueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c92a2a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Search & Rescue Outer Beacon Ring -->
  <circle cx="256" cy="232" r="176" fill="#160a0a" stroke="#ffffff" stroke-width="4"/>
  <circle cx="256" cy="232" r="158" fill="none" stroke="url(#rescueGrad)" stroke-width="3"/>

  <!-- 6-Pointed Star of Life / Emergency Cross -->
  <g fill="url(#rescueGrad)">
    <rect x="226" y="88" width="60" height="288" rx="8"/>
    <rect x="226" y="88" width="60" height="288" rx="8" transform="rotate(60 256 232)"/>
    <rect x="226" y="88" width="60" height="288" rx="8" transform="rotate(-60 256 232)"/>
  </g>

  <!-- Central White Beacon Star -->
  <polygon points="256,140 274,214 348,232 274,250 256,324 238,250 164,232 238,214" fill="#ffffff"/>
  <circle cx="256" cy="232" r="18" fill="url(#rescueGrad)"/>
</svg>

