<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#102838" stop-opacity="1"/>
      <stop offset="100%" stop-color="#07121a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ce1e6"/>
      <stop offset="100%" stop-color="#1b8599"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#8b9eb0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Outer Radar / Orbital Control Ring -->
  <circle cx="256" cy="232" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="256" y1="36" x2="256" y2="72" stroke="#5ce1e6" stroke-width="3"/>
  <line x1="256" y1="392" x2="256" y2="428" stroke="#5ce1e6" stroke-width="3"/>
  <line x1="60" y1="232" x2="96" y2="232" stroke="#5ce1e6" stroke-width="3"/>
  <line x1="416" y1="232" x2="452" y2="232" stroke="#5ce1e6" stroke-width="3"/>

  <!-- Coriolis Octagonal Starport Hull -->
  <polygon points="200,96 312,96 392,176 392,288 312,368 200,368 120,288 120,176" fill="#0b1d2a" stroke="url(#silverGrad)" stroke-width="5"/>
  <polygon points="212,120 300,120 368,188 368,276 300,344 212,344 144,276 144,188" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5"/>

  <!-- Internal Structural Struts -->
  <line x1="200" y1="96" x2="212" y2="120" stroke="#8b9eb0" stroke-width="2"/>
  <line x1="312" y1="96" x2="300" y2="120" stroke="#8b9eb0" stroke-width="2"/>
  <line x1="392" y1="176" x2="368" y2="188" stroke="#8b9eb0" stroke-width="2"/>
  <line x1="392" y1="288" x2="368" y2="276" stroke="#8b9eb0" stroke-width="2"/>
  <line x1="312" y1="368" x2="300" y2="344" stroke="#8b9eb0" stroke-width="2"/>
  <line x1="200" y1="368" x2="212" y2="344" stroke="#8b9eb0" stroke-width="2"/>
  <line x1="120" y1="288" x2="144" y2="276" stroke="#8b9eb0" stroke-width="2"/>
  <line x1="120" y1="176" x2="144" y2="188" stroke="#8b9eb0" stroke-width="2"/>

  <!-- Central Docking Slot (Mail Slot) & Guide Lights -->
  <rect x="190" y="212" width="132" height="40" rx="4" fill="#050d14" stroke="url(#cyanGrad)" stroke-width="3.5"/>
  <rect x="204" y="224" width="104" height="16" fill="#5ce1e6" fill-opacity="0.85"/>
  <circle cx="172" cy="232" r="5" fill="#46e09a"/>
  <circle cx="340" cy="232" r="5" fill="#ff4757"/>
</svg>

