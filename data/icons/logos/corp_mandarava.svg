      <stop offset="0%" stop-color="#2c1824" stop-opacity="1"/>
      <stop offset="100%" stop-color="#12090e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
