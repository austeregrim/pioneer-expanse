<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2a1f12" stop-opacity="1"/>
      <stop offset="100%" stop-color="#110d08" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6b93b"/>
      <stop offset="100%" stop-color="#b86b14"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2cc"/>
      <stop offset="100%" stop-color="#e58e26"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Heavy Hexagonal Extraction Frame -->
  <polygon points="256,58 406,145 406,319 256,406 106,319 106,145" fill="#17120b" stroke="url(#amberGrad)" stroke-width="6"/>
  <polygon points="256,84 384,158 384,306 256,380 128,306 128,158" fill="none" stroke="#8c6d46" stroke-width="2"/>

  <!-- Crossed Mining Laser / Drill Vectors -->
  <line x1="128" y1="158" x2="384" y2="306" stroke="url(#amberGrad)" stroke-width="5"/>
  <line x1="384" y1="158" x2="128" y2="306" stroke="url(#amberGrad)" stroke-width="5"/>

  <!-- Central Crystalline Core -->
  <polygon points="256,118 328,232 256,346 184,232" fill="url(#crystalGrad)" stroke="#17120b" stroke-width="4"/>
  <polygon points="256,146 302,232 256,318 210,232" fill="url(#amberGrad)"/>
  <polygon points="256,184 278,232 256,280 234,232" fill="#fff2cc"/>
</svg>

