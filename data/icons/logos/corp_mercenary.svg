  <!-- Twin Crossed Tactical Blades / Spears -->
  <polygon points="152,116 176,116 360,324 336,324" fill="url(#bladeGrad)"/>
  <polygon points="360,116 336,116 152,324 176,324" fill="url(#bladeGrad)"/>

  <!-- Central Vanguard Skull/Star Crest -->
