  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Tactical Kite Shield -->
  <polygon points="256,56 392,110 356,310 256,412 156,310 120,110" fill="#140b0e" stroke="url(#redGrad)" stroke-width="5"/>
  <polygon points="256,78 368,124 338,298 256,386 174,298 144,124" fill="none" stroke="#7c8896" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Targeting Reticle Ring -->
