<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#182232" stop-opacity="1"/>
      <stop offset="100%" stop-color="#090b18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4d6eb"/>
      <stop offset="100%" stop-color="#6b85a8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Outer Registry Hex Frame -->
  <polygon points="256,82 406,169 406,343 256,430 106,343 106,169"
           fill="#0e1422" stroke="url(#steelGrad)" stroke-width="3"/>
  <polygon points="256,104 387,180 387,332 256,408 125,332 125,180"
           fill="none" stroke="#6b85a8" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Civilian Pilot / Citizen Identification Emblem -->
  <circle cx="256" cy="212" r="46" fill="none" stroke="url(#steelGrad)" stroke-width="6"/>
  <path d="M 164 338 C 164 282, 348 282, 348 338"
        fill="none" stroke="url(#steelGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Registry Bar Accent -->
  <line x1="176" y1="364" x2="336" y2="364" stroke="#6b85a8" stroke-width="2.5" stroke-opacity="0.7"/>
</svg>

