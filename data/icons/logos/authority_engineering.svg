<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2c1d12" stop-opacity="1"/>
      <stop offset="100%" stop-color="#120c08" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#cc5c14"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dce4ec"/>
      <stop offset="100%" stop-color="#7f8c9a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Outer Industrial Ring -->
  <circle cx="256" cy="232" r="176" fill="none" stroke="url(#orangeGrad)" stroke-width="3" stroke-opacity="0.8"/>

  <!-- 8-Tooth Engineering Gear -->
  <g fill="url(#steelGrad)">
    <rect x="234" y="68" width="44" height="328" rx="6"/>
    <rect x="92" y="210" width="328" height="44" rx="6"/>
    <rect x="234" y="68" width="44" height="328" rx="6" transform="rotate(45 256 232)"/>
    <rect x="234" y="68" width="44" height="328" rx="6" transform="rotate(-45 256 232)"/>
  </g>
  <circle cx="256" cy="232" r="136" fill="url(#steelGrad)"/>
  <circle cx="256" cy="232" r="106" fill="#14100d" stroke="url(#orangeGrad)" stroke-width="4"/>

  <!-- Drydock Ship Silhouette & Thruster Plume -->
  <polygon points="256,136 320,264 282,264 256,238 230,264 192,264" fill="url(#orangeGrad)"/>
  <polygon points="256,256 276,308 256,294 236,308" fill="#ffd166"/>
</svg>

