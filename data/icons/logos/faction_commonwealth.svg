<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0f2c24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#071512" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46e09a"/>
      <stop offset="100%" stop-color="#168856"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2d680"/>
      <stop offset="100%" stop-color="#b88c28"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Outer Ring & Octagonal Frame -->
  <circle cx="256" cy="232" r="190" fill="none" stroke="#1e5c44" stroke-width="2" stroke-opacity="0.6"/>
  <polygon points="256,56 380,108 432,232 380,356 256,408 132,356 80,232 132,108" fill="#091f19" stroke="url(#emeraldGrad)" stroke-width="3.5"/>
  <circle cx="256" cy="232" r="144" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Interlocking World Rings (Unity of Independent Worlds) -->
  <circle cx="256" cy="186" r="56" fill="none" stroke="#46e09a" stroke-width="3" stroke-opacity="0.65"/>
  <circle cx="216" cy="256" r="56" fill="none" stroke="#46e09a" stroke-width="3" stroke-opacity="0.65"/>
  <circle cx="296" cy="256" r="56" fill="none" stroke="#46e09a" stroke-width="3" stroke-opacity="0.65"/>

  <!-- 8-Pointed Confederal Compass Rose -->
  <polygon points="256,102 276,212 386,232 276,252 256,362 236,252 126,232 236,212" fill="url(#emeraldGrad)"/>
  <polygon points="256,136 270,218 352,232 270,246 256,328 242,246 160,232 242,218" fill="url(#goldGrad)"/>

  <!-- Diagonal Compass Rays -->
  <polygon points="168,144 244,208 220,232" fill="url(#goldGrad)" fill-opacity="0.8"/>
  <polygon points="344,144 268,208 292,232" fill="url(#goldGrad)" fill-opacity="0.8"/>
  <polygon points="168,320 244,256 220,232" fill="url(#goldGrad)" fill-opacity="0.8"/>
  <polygon points="344,320 268,256 292,232" fill="url(#goldGrad)" fill-opacity="0.8"/>

  <!-- Central Beacon Disc -->
  <circle cx="256" cy="232" r="26" fill="#091f19" stroke="#f2d680" stroke-width="4"/>
  <circle cx="256" cy="232" r="10" fill="#46e09a"/>
</svg>

