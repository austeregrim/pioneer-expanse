<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#1c3b6e" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#0a162c" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040812" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b3"/>
      <stop offset="35%" stop-color="#f0b942"/>
      <stop offset="70%" stop-color="#c4821a"/>
      <stop offset="100%" stop-color="#7a4b08"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#d4901c"/>
    </linearGradient>
    <linearGradient id="crimsonWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="50%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#6e0d14"/>
    </linearGradient>
    <linearGradient id="shipSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#b8cadc"/>
      <stop offset="100%" stop-color="#576b82"/>
    </linearGradient>
    <radialGradient id="sunBurst" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffcf56" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Astrolabe & Navigation Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldMain)" stroke-width="2" stroke-opacity="0.45"/>
  <circle cx="256" cy="256" r="218" fill="url(#coreGlow)" stroke="url(#goldMain)" stroke-width="5"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#4ea4ff" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Cardinal & Ordinal Astrolabe Ticks -->
  <polygon points="256,12 266,42 256,34 246,42" fill="url(#goldBright)"/>
  <polygon points="256,500 266,470 256,478 246,470" fill="url(#goldBright)"/>
  <polygon points="12,256 42,266 34,256 42,246" fill="url(#goldBright)"/>
  <polygon points="500,256 470,266 478,256 470,246" fill="url(#goldBright)"/>

  <!-- Background Planetary Horizon & Orbital Ring -->
  <ellipse cx="256" cy="274" rx="192" ry="52" transform="rotate(-16 256 274)" fill="none" stroke="#4ea4ff" stroke-width="2.5" stroke-opacity="0.55"/>
  <circle cx="256" cy="316" r="118" fill="#050b16" stroke="url(#goldMain)" stroke-width="2.5"/>

  <!-- Rising Star Corona at Horizon -->
  <circle cx="256" cy="196" r="68" fill="url(#sunBurst)"/>
  <polygon points="256,64 268,178 382,196 268,214 256,328 244,214 130,196 244,178" fill="url(#goldBright)" fill-opacity="0.85"/>

  <!-- Elite / Pioneer Swept Wing Array (Left & Right) -->
  <!-- Upper Swept Primary Wings -->
  <polygon points="20,174 202,196 184,230 48,214" fill="url(#goldMain)"/>
  <polygon points="492,174 310,196 328,230 464,214" fill="url(#goldMain)"/>

  <!-- Upper Crimson Accent Blades -->
  <polygon points="36,154 196,182 188,194 56,172" fill="url(#crimsonWing)"/>
  <polygon points="476,154 316,182 324,194 456,172" fill="url(#crimsonWing)"/>

  <!-- Middle Swept Pinions -->
  <polygon points="44,226 194,238 178,268 72,258" fill="url(#goldMain)"/>
  <polygon points="468,226 318,238 334,268 440,258" fill="url(#goldMain)"/>

  <!-- Lower Swept Pinions -->
  <polygon points="76,272 186,278 170,304 104,300" fill="url(#goldMain)"/>
  <polygon points="436,272 326,278 342,304 408,300" fill="url(#goldMain)"/>

  <!-- Lower Stabilizer Fins -->
  <polygon points="114,312 180,314 166,336 136,334" fill="url(#crimsonWing)"/>
  <polygon points="398,312 332,314 346,336 376,334" fill="url(#crimsonWing)"/>

  <!-- Central Heraldic Crest Shield -->
  <polygon points="256,92 328,148 302,348 256,426 210,348 184,148" fill="#091324" stroke="url(#goldMain)" stroke-width="5"/>
  <polygon points="256,110 312,156 290,338 256,402 222,338 200,156" fill="none" stroke="url(#crimsonWing)" stroke-width="2"/>

  <!-- Ascending Delta Starship Silhouette -->
  <polygon points="256,118 318,278 278,262 256,218 234,262 194,278" fill="url(#shipSteel)" stroke="#091324" stroke-width="3"/>
  <polygon points="256,118 282,250 256,218" fill="#89a0b8"/>
  <!-- Cockpit Canopy -->
  <polygon points="256,158 268,202 256,194 244,202" fill="#4ea4ff"/>

  <!-- Twin Hyperdrive Plumes & Rank Chevrons -->
  <polygon points="256,246 278,354 256,326 234,354" fill="url(#goldBright)"/>
  <polygon points="218,342 256,368 294,342 294,360 256,386 218,360" fill="url(#goldMain)"/>
</svg>
